<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" width="180" height="48">
  <!-- Icon: navy rounded square -->
  <rect x="2" y="2" width="44" height="44" rx="9" fill="#1B3A6B"/>
  <!-- Roof: emerald triangle -->
  <polygon points="24,9 7,25 41,25" fill="#10B981"/>
  <!-- House body: white -->
  <rect x="12" y="25" width="24" height="15" rx="1" fill="white"/>
  <!-- Door: emerald -->
  <rect x="18" y="29" width="12" height="11" rx="2" fill="#10B981"/>
  <!-- "Avali" bold navy -->
  <text x="56" y="32"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="700" fill="#1B3A6B">Avali</text>
  <!-- "App" light emerald -->
  <text x="123" y="32"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="300" fill="#10B981">App</text>
</svg>
